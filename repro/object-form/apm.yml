name: repro-object-form
version: 1.0.0
description: Dependencies in APM's object form
dependencies:
  apm:
  # A git repository, with the subdirectory in `path` and the tag in `ref`
  - git: https://github.com/microsoft/apm
    path: packages/apm-guide
    ref: v0.30.0
  # A plugin from a marketplace registered with `apm marketplace add`
  - name: some-plugin
    marketplace: some-marketplace
  # A local directory
  - path: ./local-skill
  mcp: []
